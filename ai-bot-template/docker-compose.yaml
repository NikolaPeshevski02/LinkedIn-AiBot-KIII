  services:
    db:
      image: postgres:17.4
      restart: always
      environment:
        POSTGRES_USER: ${DB_USERNAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: aibot
      volumes:
        - pgdata:/var/lib/postgresql/data

    ai-bot-backend:
      build: ./ai-bot-backend
      env_file:
      - .env
      environment:
        SPRING_PROFILES_ACTIVE: docker
        SPRING_DATASOURCE_URL: ${DB_URL_DOCKER}
      depends_on:
        - db
      ports:
        - "8080:8080"

    frontend:
      build: ./ai-bot-frontend
      depends_on:
        - ai-bot-backend
      ports:
        - "3000:80"

  volumes:
    pgdata:
