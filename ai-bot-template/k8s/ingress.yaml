apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-bot-ingress
  namespace: ai-bot
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-bot-backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-bot-frontend
                port:
                  number: 80