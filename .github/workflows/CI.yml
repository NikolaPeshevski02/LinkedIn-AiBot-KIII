name: CI

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-bot-backend:latest \
            ./ai-bot-backend

      - name: Push backend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-bot-backend:latest

      - name: Build frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-bot-frontend:latest \
            ./ai-bot-frontend

      - name: Push frontend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-bot-frontend:latest
